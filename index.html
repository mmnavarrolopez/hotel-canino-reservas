        // ==========================================

        function toDateStr(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseDateStr(str) {
            if (!str) return null;
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function addDays(dateStr, days) {
            const d = parseDateStr(dateStr);
            d.setDate(d.getDate() + days);
            return toDateStr(d);
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return '-';
            const d = parseDateStr(dateStr);
            return d.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        function formatFullDate(dateStr) {
            if (!dateStr) return '-';
            const d = parseDateStr(dateStr);
            return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function formatCurrency(amount) {
            if (!amount || amount <= 0) return '$0';
            return '$' + Number(amount).toLocaleString('es-AR');
        }

        const MONTH_NAMES = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];
        const DAY_NAMES_SHORT = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

        function getTodayStr() {
            return toDateStr(new Date());
        }

        function isSpecialDate(dateStr) {
            const mmdd = dateStr.slice(5);
            return state.settings.specialDates.includes(mmdd) || state.settings.specialDates.includes(dateStr);
        }

        function getOccupiedNights(checkIn, checkOut, lateCheckout = false) {
            if (!checkIn || !checkOut) return [];
            const nights = [];
            let curr = checkIn;
            while (curr < checkOut) {
                nights.push(curr);
                curr = addDays(curr, 1);
            }
            if (lateCheckout) {
                nights.push(checkOut);
            }
            return nights;
        }

        function calculateStayDetails(checkIn, checkOut, lateCheckout = false, customRateOverride = null) {
            const nights = getOccupiedNights(checkIn, checkOut, lateCheckout);
            const totalNights = nights.length;
            let specialNightsCount = 0;
            nights.forEach(n => {
                if (isSpecialDate(n)) specialNightsCount++;
            });
            const normalNightsCount = totalNights - specialNightsCount;
            const parsedCustom = customRateOverride !== null && customRateOverride !== '' ? Number(customRateOverride) : NaN;
            const rate = !isNaN(parsedCustom) && parsedCustom > 0 ? parsedCustom : (Number(state.settings.nightlyRate) || 0);
            const specialNightExtraRate = rate;
            const totalAmount = (totalNights * rate) + (specialNightsCount * specialNightExtraRate);
            const depositPct = Number(state.settings.depositPercentage) || 50;
            const depositAmount = Math.round(totalAmount * (depositPct / 100));
            const balanceAmount = totalAmount - depositAmount;

            return {
                nights,
                rateUsed: rate,
                specialNightExtraRate,
                totalNights,
                normalNightsCount,
                specialNightsCount,
                totalAmount,
                depositAmount,
                balanceAmount
            };
        }

        function getDateOccupancy(dateStr) {
            const isBlocked = state.blockedDates.find(b => b.date === dateStr);
            
            const confirmedBookings = state.bookings.filter(b => {
                if (b.status !== 'confirmada' && b.status !== 'en_estadia') return false;
                const nights = getOccupiedNights(b.checkIn, b.checkOut, b.lateCheckout);
                return nights.includes(dateStr);
            });

            const pendingBookings = state.bookings.filter(b => {
                if (b.status !== 'pendiente_confirmacion' && b.status !== 'pendiente_sena') return false;
                const nights = getOccupiedNights(b.checkIn, b.checkOut, b.lateCheckout);
                return nights.includes(dateStr);
            });

            const maxCap = Number(state.settings.maxCapacity) || 4;
            const confirmedCount = confirmedBookings.length;
            const pendingCount = pendingBookings.length;
            const isFull = confirmedCount >= maxCap;

            return {
                isBlocked,
                confirmedBookings,
                pendingBookings,
                confirmedCount,
                pendingCount,
                maxCap,
                isFull,
                isAvailable: !isBlocked && !isFull
            };
        }

        function isRangeAvailable(checkIn, checkOut, lateCheckout = false, ignoreBookingId = null) {
            const nights = getOccupiedNights(checkIn, checkOut, lateCheckout);
            if (nights.length === 0) return { valid: false, reason: "El rango de fechas no es válido." };
            
            const maxCap = Number(state.settings.maxCapacity) || 4;
            for (const night of nights) {
                const blocked = state.blockedDates.find(b => b.date === night);
                if (blocked) {
                    return { valid: false, reason: `La fecha ${formatDisplayDate(night)} no está disponible (${blocked.reason || 'Bloqueada'}).` };
                }
                const confirmedOnNight = state.bookings.filter(b => {
                    if (b.id === ignoreBookingId) return false;
                    if (b.status !== 'confirmada' && b.status !== 'en_estadia') return false;
                    return getOccupiedNights(b.checkIn, b.checkOut, b.lateCheckout).includes(night);
                });
                if (confirmedOnNight.length >= maxCap) {
                    return { valid: false, reason: `Cupo completo para la noche del ${formatDisplayDate(night)}.` };
                }
            }
            return { valid: true };
        }

        function getMatchingDogsForRange(checkIn, checkOut, lateCheckout = false) {
            if (!checkIn || !checkOut) return [];
            const selectedNights = getOccupiedNights(checkIn, checkOut, lateCheckout);
            if (selectedNights.length === 0) return [];

            const dogsMap = new Map();

            state.hostedDogs.forEach(dog => {
                if (dog.status !== 'confirmada' && dog.status !== 'en_estadia') return;
                const dogNights = getOccupiedNights(dog.checkIn, dog.checkOut, false);
                const overlaps = selectedNights.some(n => dogNights.includes(n));
                if (overlaps) {
                    dogsMap.set(dog.bookingId || dog.id, {
                        id: dog.id,
                        name: dog.dogName,
                        photoUrl: dog.photoUrl || DEFAULT_DOGS_PHOTOS[0]
                    });
                }
            });

            state.bookings.forEach(b => {
                if (b.status !== 'confirmada' && b.status !== 'en_estadia') return;
                if (dogsMap.has(b.id)) return;
                const bNights = getOccupiedNights(b.checkIn, b.checkOut, b.lateCheckout);
                const overlaps = selectedNights.some(n => bNights.includes(n));
                if (overlaps) {
                    dogsMap.set(b.id, {
                        id: b.id,
                        name: b.dogName,
                        photoUrl: b.dogPhotoUrl || DEFAULT_DOGS_PHOTOS[Math.abs(b.dogName.length) % DEFAULT_DOGS_PHOTOS.length]
                    });
                }
            });

            return Array.from(dogsMap.values());
        }

        function compressImageToDataURL(file, maxWidth = 500, quality = 0.78) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ==========================================

                toast.style.transition = 'all 0.25s ease';
                setTimeout(() => toast.remove(), 250);

        function copyToClipboard(text, successMsg = "Copiado al portapapeles") {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMsg, 'success');
            } catch (err) {
                showToast("No se pudo copiar automáticamente", "error");
            }
            document.body.removeChild(textarea);
        }

        function setupRealtimeListeners() {
            if (isLocalFallback) {
                state.dataLoaded = true;
                document.getElementById('loading-screen').classList.add('hidden');
                render();
                return;
            }

            let loadedCount = 0;
            const checkAllLoaded = () => {
                loadedCount++;
                if (loadedCount >= 4 && !state.dataLoaded) {
                    state.dataLoaded = true;
                    document.getElementById('loading-screen').classList.add('hidden');
                }
                render();
            };

            onSnapshot(getSettingsRef(), (docSnap) => {
                if (docSnap.exists()) {
                    state.settings = { ...state.settings, ...docSnap.data() };
                }
                checkAllLoaded();
            }, (err) => {
                console.error("Settings snapshot error:", err);
                checkAllLoaded();
            });

            onSnapshot(getBookingsCol(), (snapshot) => {
                const list = [];
                snapshot.forEach(d => list.push({ id: d.id, ...d.data() }));
                list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
                state.bookings = list;
                checkAllLoaded();
            }, (err) => {
                console.error("Bookings snapshot error:", err);
                checkAllLoaded();
            });

            onSnapshot(getHostedDogsCol(), (snapshot) => {
                const list = [];
                snapshot.forEach(d => list.push({ id: d.id, ...d.data() }));
                state.hostedDogs = list;
                checkAllLoaded();
            }, (err) => {
                console.error("HostedDogs snapshot error:", err);
                checkAllLoaded();
            });

            onSnapshot(getBlockedDatesCol(), (snapshot) => {
                const list = [];
                snapshot.forEach(d => list.push({ id: d.id, ...d.data() }));
                state.blockedDates = list;
                checkAllLoaded();
            }, (err) => {
                console.error("BlockedDates snapshot error:", err);
                checkAllLoaded();
            });
        }

        async function initApp() {
            if (isLocalFallback) {
                setupRealtimeListeners();
                return;
            }
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                state.user = auth.currentUser;
                await seedInitialDataIfNeeded();
                setupRealtimeListeners();
            } catch (error) {
                console.error("Auth initialization error:", error);
                document.getElementById('loading-screen').classList.add('hidden');
                showToast("Error conectando con la base de datos", "error");
            }
        }

        // ==========================================
        // 6. VIEW SWITCHING & NAVIGATION
        // ==========================================
        window.switchView = function(targetView) {
            state.view = targetView;
            try {
                if (window.location.protocol !== 'blob:') {
                    const url = new URL(window.location.href);
                    if (targetView === 'admin') {
                        url.searchParams.set('view', 'admin');
                    } else {
                        url.searchParams.delete('view');
                    }
                    window.history.pushState({}, '', url);
                } else {
                    window.location.hash = targetView === 'admin' ? '#admin' : '';
                }
            } catch (e) {}
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        };

        window.sharePublicLink = function() {
            let shareUrl = window.location.href;
            try {
                const url = new URL(window.location.href);
                url.searchParams.delete('view');
                url.hash = '';
                shareUrl = url.toString();
            } catch (e) {}
            copyToClipboard(shareUrl, "¡Enlace de reservas copiado! Listo para pegar en WhatsApp 🐶");
        };

        // ==========================================
        // 7. PUBLIC VIEW: CALENDAR & INTERACTIONS
        // ==========================================
        window.changePublicMonth = function(delta) {
            let m = state.currentMonth + delta;
            let y = state.currentYear;
            if (m < 0) { m = 11; y--; }
            if (m > 11) { m = 0; y++; }
            const now = new Date();
            if (y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth())) {
                return;
            }
            state.currentMonth = m;
            state.currentYear = y;
            render();
        };

        window.handlePublicDateClick = function(dateStr) {
            const todayStr = getTodayStr();
            if (dateStr < todayStr) return;

            const occ = getDateOccupancy(dateStr);

            if (!state.selectedCheckIn || (state.selectedCheckIn && state.selectedCheckOut)) {
                if (!occ.isAvailable) {
                    showToast("Esa fecha de ingreso no tiene cupo disponible.", "warning");
                    return;
                }
                state.selectedCheckIn = dateStr;
                state.selectedCheckOut = null;
                render();
                return;
            }

            if (dateStr === state.selectedCheckIn) {
                state.selectedCheckIn = null;
                state.selectedCheckOut = null;
                render();
                return;
            }

            if (dateStr < state.selectedCheckIn) {
                if (!occ.isAvailable) {
                    showToast("Esa fecha de ingreso no tiene cupo disponible.", "warning");
                    return;
                }
                state.selectedCheckIn = dateStr;
                state.selectedCheckOut = null;
                render();
                return;
            }

            const check = isRangeAvailable(state.selectedCheckIn, dateStr, state.lateCheckout);
            if (!check.valid) {
                showToast(check.reason, "error");
                return;
            }

            state.selectedCheckOut = dateStr;
            render();

            if (window.innerWidth < 1024) {
                setTimeout(() => {
                    const dogsEl = document.getElementById('matching-dogs-section');
                    if (dogsEl) dogsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 150);
            }
        };

        window.toggleLateCheckout = function(checked) {
            if (state.selectedCheckIn && state.selectedCheckOut) {
                const check = isRangeAvailable(state.selectedCheckIn, state.selectedCheckOut, checked);
                if (!check.valid) {
                    showToast("No hay cupo disponible para extender el retiro después de las 13:00 hs.", "error");
                    render();
                    return;
                }
            }
            state.lateCheckout = checked;
            render();
        };

        window.clearSelection = function() {
            state.selectedCheckIn = null;
            state.selectedCheckOut = null;

            const details = calculateStayDetails(state.selectedCheckIn, state.selectedCheckOut, state.lateCheckout, state.clientCustomRate);
            const hasRate = details.rateUsed > 0;

            if (calcBox) {
                calcBox.innerHTML = hasRate ? `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-sm">

        function buildOwnerNotificationPayload(booking, details) {
            const hasRate = details.rateUsed > 0;
            const specialNightsCount = details.specialNightsCount ?? 0;
            const rawMessage =
                `¡Hola ${state.settings.hotelName}! 🐶 Acabo de solicitar una reserva:\n` +
                `• Perrito: *${booking.dogName}*\n` +
                `• Tutor: ${booking.ownerName}\n` +
                (booking.whatsapp ? `• WhatsApp cliente: ${booking.whatsapp}\n` : '') +
                `• Ingreso: ${formatFullDate(booking.checkIn)} (desde 12:00 hs)\n` +
                `• Salida: ${formatFullDate(booking.checkOut)} ${booking.lateCheckout ? '(después de 13:00 hs)' : '(hasta 13:00 hs)'}\n` +
                `• Noches: ${details.totalNights}\n` +
                `• Noches especiales: ${specialNightsCount}\n` +
                (hasRate
                    ? `• Tarifa por noche acordada: ${formatCurrency(details.rateUsed)}\n` +
                      `• Total estadía: ${formatCurrency(details.totalAmount)}\n` +
                      `• Seña (${state.settings.depositPercentage}%): ${formatCurrency(details.depositAmount)}\n`
                    : '') +
                (booking.notes ? `• Observaciones: ${booking.notes}\n` : '') +
                `Quedo atento/a para enviar el carnet de vacunación y comprobante de seña. 💛`;

            const cleanOwnerPhone = (state.settings.ownerWhatsapp || '').replace(/\D/g, '');
            const waUrl = `https://wa.me/${cleanOwnerPhone}?text=${encodeURIComponent(rawMessage)}`;
            const plainTextMessage = rawMessage.replace(/\*/g, '');
            const mailSubject = encodeURIComponent(`Nueva solicitud de reserva: ${booking.dogName} (${formatFullDate(booking.checkIn)})`);
            const mailBody = encodeURIComponent(plainTextMessage);
            const mailtoUrl = `mailto:${state.settings.ownerEmail || ''}?subject=${mailSubject}&body=${mailBody}`;

            return { waUrl, mailtoUrl, plainTextMessage, hasRate };
        }

        async function sendBackgroundEmailIfConfigured(booking, details, plainTextMessage) {
            const { emailjsPublicKey, emailjsServiceId, emailjsTemplateId, ownerEmail } = state.settings;
            if (!emailjsPublicKey || !emailjsServiceId || !emailjsTemplateId || !ownerEmail) {
                return false;
            }
            try {
                const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lib_version: '4.4.1',
                        user_id: emailjsPublicKey,
                        service_id: emailjsServiceId,
                        template_id: emailjsTemplateId,
                        template_params: {
                            to_email: ownerEmail,
                            dog_name: booking.dogName,
                            owner_name: booking.ownerName,
                            client_whatsapp: booking.whatsapp || 'No informado',
                            check_in: formatFullDate(booking.checkIn),
                            check_out: formatFullDate(booking.checkOut),
                            nights_count: details.totalNights,
                            special_nights_count: details.specialNightsCount ?? 0,
                            total_amount: formatCurrency(details.totalAmount),
                            deposit_amount: formatCurrency(details.depositAmount),
                            notes: booking.notes || 'Sin observaciones',
                            message: plainTextMessage
                        }
                    })
                });
                return res.ok;
            } catch (err) {
                console.error("Error enviando correo con EmailJS:", err);
                return false;
            }
        }

        window.submitBookingRequest = async function(e) {
            e.preventDefault();
            if (state.submitting) return;

            if (!state.selectedCheckIn || !state.selectedCheckOut) {
                showToast("Por favor seleccioná las fechas de ingreso y salida en el calendario.", "warning");
                return;
            }

            const ownerName = document.getElementById('req-owner-name').value.trim();
            const dogName = document.getElementById('req-dog-name').value.trim();
            const whatsapp = document.getElementById('req-whatsapp').value.trim();
            const notes = document.getElementById('req-notes').value.trim();
            const accepted = document.getElementById('req-terms').checked;

            if (!ownerName || !dogName) {
                showToast("Completá tu nombre y el nombre de tu perrito.", "warning");
                return;
            }
            if (!accepted) {
                showToast("Debés aceptar las condiciones del servicio para continuar.", "warning");
                return;
            }

            const check = isRangeAvailable(state.selectedCheckIn, state.selectedCheckOut, state.lateCheckout);
            if (!check.valid) {
                showToast(check.reason, "error");
                return;
            }

            state.submitting = true;
            render();

            try {
                const details = calculateStayDetails(state.selectedCheckIn, state.selectedCheckOut, state.lateCheckout, state.clientCustomRate);
                const newBooking = {
                    ownerName,
                    dogName,
                    dogPhotoUrl: "",
                    whatsapp,
                    checkIn: state.selectedCheckIn,
                    checkOut: state.selectedCheckOut,
                    lateCheckout: state.lateCheckout,
                    notes,
                    privateNotes: "",
                    status: "pendiente_confirmacion",
                    nightlyRateApplied: details.rateUsed,
                    nightsCount: details.totalNights,
                    specialNightsCount: details.specialNightsCount,
                    totalAmount: details.totalAmount,
                    depositAmount: details.depositAmount,
                    depositPaid: false,
                    balancePaid: false,
                    createdAt: new Date().toISOString()
                };

                if (!isLocalFallback) {
                    await addDoc(getBookingsCol(), newBooking);
                } else {
                    state.bookings.unshift({ id: 'local-' + Date.now(), ...newBooking });
                }

                const notif = buildOwnerNotificationPayload(newBooking, details);
                const emailSent = await sendBackgroundEmailIfConfigured(newBooking, details, notif.plainTextMessage);

                if (state.settings.ownerWhatsapp) {
                    window.open(notif.waUrl, '_blank', 'noopener,noreferrer');
                }

                if (emailSent) {
                    showToast("¡Notificación enviada a tu correo electrónico!", "success");
                }

                showBookingConfirmationModal(newBooking, details, notif, emailSent);
                state.clientCustomRate = '';
            } catch (err) {
                console.error("Error creating booking:", err);
                showToast("Ocurrió un error al enviar tu solicitud. Intentá nuevamente.", "error");
            } finally {
                state.submitting = false;
                render();
            }
        };

        function renderPublicCalendar() {
            const year = state.currentYear;
            const month = state.currentMonth;
            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayStr = getTodayStr();
            const now = new Date();
            const canGoPrev = year > now.getFullYear() || (year === now.getFullYear() && month > now.getMonth());

            const selectedRangeNights = (state.selectedCheckIn && state.selectedCheckOut)
                ? getOccupiedNights(state.selectedCheckIn, state.selectedCheckOut, state.lateCheckout)
                : [];

            let cellsHtml = '';
            for (let i = 0; i < firstDayOfMonth; i++) {
                cellsHtml += `<div class="aspect-square"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isPast = dateStr < todayStr;
                const occ = getDateOccupancy(dateStr);
                const special = isSpecialDate(dateStr);

                const isStart = state.selectedCheckIn === dateStr;
                const isEnd = state.selectedCheckOut === dateStr;
                const isInRange = selectedRangeNights.includes(dateStr) || (state.selectedCheckIn && state.selectedCheckOut && dateStr >= state.selectedCheckIn && dateStr <= state.selectedCheckOut);

                let btnClasses = "calendar-day relative aspect-square rounded-2xl flex flex-col items-center justify-center text-sm font-bold border ";
                let statusDot = "";

                if (isPast) {
                    btnClasses += "bg-cream-100/60 text-brown-600/35 border-transparent cursor-not-allowed";
                } else if (isStart || isEnd) {
                    btnClasses += "bg-brown-700 text-white border-brown-800 shadow-md ring-2 ring-terracotta-400 z-10";
                } else if (isInRange) {
                    btnClasses += "bg-terracotta-400/25 text-brown-900 border-terracotta-400";
                } else if (occ.isBlocked || occ.isFull) {
                    btnClasses += "bg-busystatus-100 text-busystatus-600 border-busystatus-500/30 cursor-not-allowed line-through opacity-80";
                    statusDot = `<span class="w-1.5 h-1.5 rounded-full bg-busystatus-500 mt-0.5"></span>`;
                } else if (occ.pendingCount > 0) {
                    btnClasses += "bg-amberstatus-100/80 text-brown-900 border-amberstatus-500/40 hover:border-brown-700 cursor-pointer";
                    statusDot = `<span class="w-1.5 h-1.5 rounded-full bg-amberstatus-500 mt-0.5"></span>`;
                } else if (occ.confirmedCount > 0) {
                    btnClasses += "bg-sage-100/70 text-brown-900 border-sage-500/40 hover:border-brown-700 cursor-pointer";
                    statusDot = `<span class="flex gap-0.5 mt-0.5"><span class="w-1.5 h-1.5 rounded-full bg-sage-500"></span></span>`;
                } else {
                    btnClasses += "bg-white text-brown-800 border-cream-300 hover:border-terracotta-500 hover:bg-cream-50 cursor-pointer";
                    statusDot = `<span class="w-1.5 h-1.5 rounded-full bg-sage-500/60 mt-0.5"></span>`;
                }

                cellsHtml += `
                    <button 
                        type="button"
                        ${isPast ? 'disabled' : ''}
                        onclick="handlePublicDateClick('${dateStr}')"
                        class="${btnClasses}"
                        title="${occ.isBlocked ? 'Fecha no disponible' : occ.isFull ? 'Cupo completo' : special ? 'Fecha especial (Tarifa doble)' : 'Disponible'}"
                    >
                        <span>${day}</span>
                        ${special && !isPast ? `<span class="absolute top-1 right-1.5 text-[9px] text-terracotta-600 font-extrabold">2x</span>` : ''}
                        ${!isPast && !isStart && !isEnd ? statusDot : ''}
                        ${isStart ? `<span class="text-[9px] uppercase tracking-tighter leading-none mt-0.5 text-terracotta-400">In</span>` : ''}
                        ${isEnd ? `<span class="text-[9px] uppercase tracking-tighter leading-none mt-0.5 text-terracotta-400">Out</span>` : ''}
                    </button>
                `;
            }

            return `
                <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-cream-300">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h2 class="font-display font-extrabold text-xl text-brown-900 flex items-center gap-2">
                                <i data-lucide="calendar-days" class="w-5 h-5 text-terracotta-500"></i>
                                Disponibilidad
                            </h2>
                            <p class="text-xs text-brown-600 mt-0.5">
                                ${!state.selectedCheckIn 
                                    ? 'Tocá el día de <strong>ingreso (Check-in)</strong>' 
                                    : !state.selectedCheckOut 
                                        ? 'Ahora tocá el día de <strong>salida (Check-out)</strong>' 
                                        : '¡Fechas seleccionadas! Podés modificarlas tocando otro día'}
                            </p>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="changePublicMonth(-1)" ${!canGoPrev ? 'disabled' : ''} class="p-2.5 rounded-xl border border-cream-300 bg-cream-50 hover:bg-cream-200 disabled:opacity-30 disabled:pointer-events-none text-brown-800 transition">
                                <i data-lucide="chevron-left" class="w-5 h-5"></i>
                            </button>
                            <span class="font-display font-bold text-sm sm:text-base text-brown-900 min-w-[125px] text-center">
                                ${MONTH_NAMES[month]} ${year}
                            </span>
                            <button type="button" onclick="changePublicMonth(1)" class="p-2.5 rounded-xl border border-cream-300 bg-cream-50 hover:bg-cream-200 text-brown-800 transition">
                                <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-7 gap-1.5 sm:gap-2 mb-2 text-center">
                        ${DAY_NAMES_SHORT.map(d => `<div class="text-xs font-bold text-brown-600 py-1">${d}</div>`).join('')}
                    </div>

                    <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
                        ${cellsHtml}
                    </div>

                    <div class="mt-5 pt-4 border-t border-cream-200 flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-brown-700">
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-3 rounded-full bg-sage-500"></span>
                            <span>Disponible / Con amiguitos</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-3 rounded-full bg-amberstatus-500"></span>
                            <span>Pendiente de confirmación</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-3 rounded-full bg-busystatus-500"></span>
                            <span>Completo / No disponible</span>
                        </div>

       window.handleAdminLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();

            if (!email || !password) {
                showToast("Ingresá tu correo y contraseña.", "error");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                state.isAdminAuthenticated = true;
                showToast("¡Bienvenido al Panel de Administración!", "success");
                render();
            } catch (err) {
                console.error("Error de login Firebase:", err.code, err.message);
                showToast("Credenciales incorrectas. Verificá usuario y contraseña.", "error");
            }
        };

        window.adminLogout = function() {
            state.isAdminAuthenticated = false;
            switchView('public');
        };

        window.setAdminTab = function(tab) {
            state.adminTab = tab;
            render();
        };

        window.setBookingFilter = function(filter) {
            state.bookingFilter = filter;
            render();
        };

        window.changeAdminMonth = function(delta) {
            let m = state.adminMonth + delta;
            let y = state.adminYear;
            if (m < 0) { m = 11; y--; }
            if (m > 11) { m = 0; y++; }
            state.adminMonth = m;
            state.adminYear = y;
            render();
        };

        window.updateBookingStatus = async function(bookingId, newStatus) {
            const booking = state.bookings.find(b => b.id === bookingId);
            if (!booking) return;

            if (newStatus === 'confirmada' || newStatus === 'en_estadia') {
                const check = isRangeAvailable(booking.checkIn, booking.checkOut, booking.lateCheckout, booking.id);
                if (!check.valid) {
                    showToast(`No se puede confirmar: ${check.reason}`, "error");
                    return;
                }
            }

            try {
                if (!isLocalFallback) {
                    await updateDoc(doc(getBookingsCol(), bookingId), { status: newStatus });
                    const linkedDog = state.hostedDogs.find(d => d.bookingId === bookingId);
                    if (linkedDog) {
                        await updateDoc(doc(getHostedDogsCol(), linkedDog.id), { status: newStatus });
                    } else if (newStatus === 'confirmada' || newStatus === 'en_estadia') {
                        await addDoc(getHostedDogsCol(), {
                            dogName: booking.dogName,
                            photoUrl: booking.dogPhotoUrl || DEFAULT_DOGS_PHOTOS[Math.abs(booking.dogName.length) % DEFAULT_DOGS_PHOTOS.length],
                            checkIn: booking.checkIn,
                            checkOut: booking.checkOut,
                            status: newStatus,
                            bookingId: booking.id
                        });
                    }
                } else {

        window.saveBookingEdits = async function(e, bookingId) {
            e.preventDefault();
            const b = state.bookings.find(item => item.id === bookingId);
            if (!b) return;

            const dogName = document.getElementById('edit-b-dog').value.trim();
            const ownerName = document.getElementById('edit-b-owner').value.trim();
            const checkIn = document.getElementById('edit-b-in').value;
            const checkOut = document.getElementById('edit-b-out').value;
            const lateCheckout = document.getElementById('edit-b-late').checked;
            const privateNotes = document.getElementById('edit-b-private').value.trim();
            const fileInput = document.getElementById('edit-b-photo-file');

            if (checkOut <= checkIn) {
                showToast("La salida debe ser posterior al ingreso.", "error");
                return;
            }

            if (b.status === 'confirmada' || b.status === 'en_estadia') {
                const check = isRangeAvailable(checkIn, checkOut, lateCheckout, bookingId);
                if (!check.valid) {
                    showToast(check.reason, "error");
                    return;
                }
            }

            let photoUrl = b.dogPhotoUrl || "";
            if (fileInput.files && fileInput.files[0]) {
                photoUrl = await compressImageToDataURL(fileInput.files[0]);
            }

            const details = calculateStayDetails(checkIn, checkOut, lateCheckout);
            const updates = {
                dogName,
                ownerName,
                checkIn,
                checkOut,
                lateCheckout,
                privateNotes,
                dogPhotoUrl: photoUrl,
                nightsCount: details.totalNights,
                specialNightsCount: details.specialNightsCount,
                totalAmount: details.totalAmount,
                depositAmount: details.depositAmount
            };

            try {
                if (!isLocalFallback) {
                    await updateDoc(doc(getBookingsCol(), bookingId), updates);
                    const linkedDog = state.hostedDogs.find(d => d.bookingId === bookingId);
                    if (linkedDog) {
                        await updateDoc(doc(getHostedDogsCol(), linkedDog.id), {
                            dogName,
                            checkIn,
                            checkOut,
                            ...(photoUrl ? { photoUrl } : {})
                        });
                    }
                } else {
                    Object.assign(b, updates);
                }
                closeModal();
                showToast("Reserva actualizada correctamente", "success");
            } catch (err) {
                showToast("Error al guardar cambios", "error");
            }
        };

        window.saveHostedDog = async function(e, dogId) {
            e.preventDefault();
            const dogName = document.getElementById('dog-form-name').value.trim();
            const checkIn = document.getElementById('dog-form-in').value;
            const checkOut = document.getElementById('dog-form-out').value;
            const status = document.getElementById('dog-form-status').value;
            const fileInput = document.getElementById('dog-form-file');

            if (checkOut <= checkIn) {
                showToast("La salida debe ser posterior al ingreso.", "error");
                return;
            }

            let photoUrl = dogId ? state.hostedDogs.find(d => d.id === dogId)?.photoUrl : DEFAULT_DOGS_PHOTOS[0];
            if (fileInput.files && fileInput.files[0]) {
                photoUrl = await compressImageToDataURL(fileInput.files[0]);
            }

            const shouldBeConfirmedInDashboard = status === 'confirmada' || status === 'en_estadia';

            try {
                if (!isLocalFallback) {
                    if (dogId) {
                        const existingDog = state.hostedDogs.find(d => d.id === dogId);
                        let linkedBookingId = existingDog?.bookingId || "";

                        if (shouldBeConfirmedInDashboard) {
                            if (linkedBookingId) {
                                await updateDoc(doc(getBookingsCol(), linkedBookingId), {
                                    petName: dogName,
                                    checkIn,
                                    checkOut,
                                    status: 'confirmada'
                                });
                            } else {
                                const newBookingRef = await addDoc(getBookingsCol(), {
                                    ownerName: "Carga manual",
                                    petName: dogName,
                                    checkIn,
                                    checkOut,
                                    status: 'confirmada',
                                    source: 'manual_dog',
                                    createdAt: new Date().toISOString()
                                });
                                linkedBookingId = newBookingRef.id;
                            }
                        } else if (linkedBookingId) {
                            await updateDoc(doc(getBookingsCol(), linkedBookingId), {
                                status: 'cancelada'
                            });
                        }

                        await updateDoc(doc(getHostedDogsCol(), dogId), {
                            dogName,
                            photoUrl,
                            checkIn,
                            checkOut,
                            status,
                            bookingId: linkedBookingId
                        });
                    } else {
                        let linkedBookingId = "";
                        if (shouldBeConfirmedInDashboard) {
                            const newBookingRef = await addDoc(getBookingsCol(), {
                                ownerName: "Carga manual",
                                petName: dogName,
                                checkIn,
                                checkOut,
                                status: 'confirmada',
                                source: 'manual_dog',
                                createdAt: new Date().toISOString()
                            });
                            linkedBookingId = newBookingRef.id;
                        }

                        await addDoc(getHostedDogsCol(), {
                            dogName,
                            photoUrl,
                            checkIn,
                            checkOut,
                            status,
                            bookingId: linkedBookingId
                        });
                    }
                } else {
                    if (dogId) {
                        const d = state.hostedDogs.find(x => x.id === dogId);
                        Object.assign(d, { dogName, photoUrl, checkIn, checkOut, status });
                    } else {
                        state.hostedDogs.push({ id: 'dog-' + Date.now(), dogName, photoUrl, checkIn, checkOut, status });
                    }
                }
                closeModal();
                showToast("Perrito guardado y sincronizado con el panel y la web pública 🐶", "success");
            } catch (err) {
                console.error("Error al guardar perrito:", err);
                showToast("Error al guardar perrito", "error");
            }
        };

        function getStatusBadge(status) {
            const map = {
                pendiente_confirmacion: { label: 'Pendiente confirmación', cls: 'bg-amberstatus-100 text-amberstatus-600' },
                pendiente_sena: { label: 'Pendiente de seña', cls: 'bg-orange-100 text-orange-700' },

                finalizada: { label: 'Finalizada', cls: 'bg-cream-200 text-brown-700' },
                cancelada: { label: 'Cancelada', cls: 'bg-busystatus-100 text-busystatus-600' }
            };
            const item = map[status] || { label: status, cls: 'bg-cream-200 text-brown-800' };
            return `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${item.cls}">${item.label}</span>`;
        }

        function renderAdminDashboard() {
            const todayStr = getTodayStr();
            const confirmedTotal = state.bookings.filter(b => b.status === 'confirmada' || b.status === 'en_estadia').length;
            const pendingTotal = state.bookings.filter(b => b.status === 'pendiente_confirmacion' || b.status === 'pendiente_sena').length;
            const upcomingTotal = state.bookings.filter(b => (b.status === 'confirmada' || b.status === 'en_estadia') && b.checkIn >= todayStr).length;
            const hostedToday = state.bookings.filter(b => {
                if (b.status !== 'confirmada' && b.status !== 'en_estadia') return false;
                return getOccupiedNights(b.checkIn, b.checkOut, b.lateCheckout).includes(todayStr);
            }).length;

            const y = today.getFullYear();
            const m = today.getMonth();
            const daysInM = new Date(y, m + 1, 0).getDate();
            let occupiedDays = 0;
            let availableDays = 0;
            for (let d = 1; d <= daysInM; d++) {
                const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const occ = getDateOccupancy(ds);
                if (occ.confirmedCount > 0 || occ.isBlocked) occupiedDays++;
                if (occ.isAvailable && ds >= todayStr) availableDays++;
            }

            const pendingList = state.bookings.filter(b => b.status === 'pendiente_confirmacion' || b.status === 'pendiente_sena');

            return `
                <div class="space-y-6 animate-fade-in">
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
                        <div class="bg-white p-4 rounded-2xl border border-cream-300 shadow-xs">

                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-cream-300 shadow-xs">
                            <span class="text-xs text-brown-600 font-semibold">Pendientes</span>
                            <p class="font-display font-extrabold text-2xl text-amberstatus-600 mt-1">${pendingTotal}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-cream-300 shadow-xs">
                            <span class="text-xs text-brown-600 font-semibold">Próximas estadías</span>
                            <p class="font-display font-extrabold text-2xl text-brown-900 mt-1">${upcomingTotal}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-cream-300 shadow-xs">
                            <span class="text-xs text-brown-600 font-semibold">Alojados hoy</span>
                            <p class="font-display font-extrabold text-2xl text-terracotta-600 mt-1">${hostedToday} / ${state.settings.maxCapacity}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-cream-300 shadow-xs">
                            <span class="text-xs text-brown-600 font-semibold">Días ocupados (mes)</span>
                            <p class="font-display font-extrabold text-2xl text-brown-800 mt-1">${occupiedDays}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-cream-300 shadow-xs">
                            <span class="text-xs text-brown-600 font-semibold">Días disp. (mes)</span>
                            <p class="font-display font-extrabold text-2xl text-sage-600 mt-1">${availableDays}</p>

                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-display font-extrabold text-lg text-brown-900 flex items-center gap-2">
                                <i data-lucide="bell-ring" class="w-5 h-5 text-amberstatus-500"></i>
                                Solicitudes pendientes de revisión (${pendingList.length})
                            </h3>

        function renderAdminCalendar(compact = false) {
            const year = state.adminYear;
            const month = state.adminMonth;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let cells = '';
            for (let i = 0; i < firstDay; i++) {
                cells += `<div class="min-h-[70px] sm:min-h-[85px] bg-cream-50/40 rounded-xl"></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const occ = getDateOccupancy(ds);
                let bg = "bg-white border-cream-300";
                if (occ.isBlocked) bg = "bg-slate-200/80 border-slate-400";
                else if (occ.isFull) bg = "bg-busystatus-100 border-busystatus-500/40";
                else if (occ.confirmedCount > 0) bg = "bg-sage-100/70 border-sage-500/40";
                else if (occ.pendingCount > 0) bg = "bg-amberstatus-100/70 border-amberstatus-500/40";

                cells += `
                    <div class="min-h-[70px] sm:min-h-[85px] p-1.5 sm:p-2 rounded-xl border ${bg} flex flex-col justify-between text-xs">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-brown-900">${d}</span>
                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-white/80 text-brown-700">${occ.confirmedCount}/${occ.maxCap}</span>
                        </div>
                        <div class="space-y-0.5 mt-1 overflow-hidden">
                            ${occ.isBlocked ? `<span class="block text-[10px] font-bold text-slate-700 truncate">🚫 ${occ.isBlocked.reason}</span>` : ''}
                            ${occ.confirmedBookings.map(b => `<span class="block text-[10px] font-bold text-sage-600 truncate">🐶 ${b.dogName}</span>`).join('')}
                            ${occ.pendingBookings.map(b => `<span class="block text-[10px] font-semibold text-amberstatus-600 truncate">⏳ ${b.dogName}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="space-y-5 animate-fade-in">
                    <div class="bg-white rounded-3xl p-5 sm:p-6 border border-cream-300 shadow-xs">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-display font-extrabold text-lg sm:text-xl text-brown-900">Calendario de Ocupación</h3>
                            <div class="flex items-center gap-1.5">
                                <button onclick="changeAdminMonth(-1)" class="p-2 rounded-xl bg-cream-100 hover:bg-cream-200 text-brown-800">
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                                </button>
                                <span class="font-display font-bold text-sm min-w-[120px] text-center">${MONTH_NAMES[month]} ${year}</span>
                                <button onclick="changeAdminMonth(1)" class="p-2 rounded-xl bg-cream-100 hover:bg-cream-200 text-brown-800">
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-7 gap-1.5 mb-1.5 text-center">
                            ${DAY_NAMES_SHORT.map(dn => `<div class="text-xs font-bold text-brown-600">${dn}</div>`).join('')}
                        </div>
                        <div class="grid grid-cols-7 gap-1.5">
                            ${cells}
                        </div>
                    </div>

                    ${!compact ? `
                        <div class="bg-white rounded-3xl p-5 sm:p-6 border border-cream-300 shadow-xs">
                            <h4 class="font-display font-extrabold text-lg text-brown-900 mb-3">Bloquear fechas manualmente (Vacaciones / Mantenimiento)</h4>
                            <form onsubmit="handleBlockDateSubmit(event)" class="flex flex-col sm:flex-row gap-3">
                                <input type="date" id="block-date-input" required class="px-4 py-2.5 rounded-xl bg-cream-50 border border-cream-300 text-sm">
                                <input type="text" id="block-reason-input" placeholder="Motivo (ej. Vacaciones, Mantenimiento)" class="flex-1 px-4 py-2.5 rounded-xl bg-cream-50 border border-cream-300 text-sm">
                                <button type="submit" class="bg-brown-800 hover:bg-brown-900 text-white font-bold text-sm px-5 py-2.5 rounded-xl transition">Bloquear fecha</button>
                            </form>

                            ${state.blockedDates.length > 0 ? `
                                <div class="mt-4 flex flex-wrap gap-2">
                                    ${state.blockedDates.map(b => `
                                        <span class="inline-flex items-center gap-2 bg-slate-100 border border-slate-300 text-slate-800 text-xs font-bold px-3 py-1.5 rounded-xl">
                                            🚫 ${formatFullDate(b.date)} (${b.reason})
                                            <button onclick="unblockDate('${b.id}')" class="text-busystatus-600 hover:underline ml-1">Quitar</button>

                                <div>
                                    <label class="block text-xs font-bold text-brown-700 mb-1">Contraseña</label>
                                    <input type="password" id="admin-password" placeholder="••••••••••••" required class="w-full px-4 py-3 rounded-xl bg-cream-50 border border-cream-300 text-sm">
                                </div>
                                <button type="submit" class="w-full bg-brown-800 hover:bg-brown-900 text-white font-bold py-3.5 rounded-2xl transition text-sm">
                                    Iniciar Sesión
                                </button>
                            </form>

                           <div class="mt-4 pt-4 border-t border-cream-200 flex flex-col gap-2">
                                <a href="./" class="block text-center w-full text-brown-600 hover:text-brown-900 font-semibold py-2 text-xs transition">
                                    ← Volver a la página pública de reservas
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }

            const tabs = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'bookings', label: 'Reservas', icon: 'clipboard-list' },
                { id: 'dogs', label: 'Perritos alojados', icon: 'dog' },
                { id: 'calendar', label: 'Calendario y Bloqueos', icon: 'calendar' },
                { id: 'settings', label: 'Tarifas y Config.', icon: 'settings' }
            ];

            let tabContent = '';
            if (state.adminTab === 'dashboard') tabContent = renderAdminDashboard();
            else if (state.adminTab === 'bookings') tabContent = renderAdminBookings();
            else if (state.adminTab === 'dogs') tabContent = renderAdminHostedDogs();
            else if (state.adminTab === 'calendar') tabContent = renderAdminCalendar(false);
            else if (state.adminTab === 'settings') tabContent = renderAdminSettings();

            return `
                <header class="bg-brown-900 text-white sticky top-0 z-30 shadow-md">
                    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-terracotta-500 text-white flex items-center justify-center shrink-0">
                                <i data-lucide="paw-print" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h1 class="font-display font-extrabold text-base sm:text-lg leading-tight">Admin — ${state.settings.hotelName}</h1>
                                <p class="text-[11px] text-cream-300">Gestión en tiempo real</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="sharePublicLink()" class="hidden sm:flex items-center gap-1.5 bg-brown-800 hover:bg-brown-700 text-cream-100 text-xs font-bold px-3 py-2 rounded-xl border border-brown-600 transition">
                                <i data-lucide="link" class="w-3.5 h-3.5"></i>
                                Copiar enlace clientes
                            </button>
                            <button onclick="switchView('public')" class="flex items-center gap-1.5 bg-terracotta-500 hover:bg-terracotta-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition">
                                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                                Volver a vista pública
                            </button>
                            <button onclick="adminLogout()" class="p-2 rounded-xl bg-brown-800 hover:bg-busystatus-600 text-cream-200 hover:text-white transition" title="Cerrar sesión">
                                <i data-lucide="log-out" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="bg-brown-800 border-t border-brown-700">
                        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center gap-1 overflow-x-auto">
                            ${tabs.map(t => `
                                <button onclick="setAdminTab('${t.id}')" class="flex items-center gap-2 px-4 py-3 text-xs sm:text-sm font-bold whitespace-nowrap border-b-2 transition ${state.adminTab === t.id ? 'border-terracotta-400 text-terracotta-400' : 'border-transparent text-cream-200 hover:text-white'}">
                                    <i data-lucide="${t.icon}" class="w-4 h-4"></i>
                                    ${t.label}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </header>

                <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
                    ${tabContent}
                </main>
            `;
        }

        // ==========================================
        // 11. MASTER RENDER
        // ==========================================
        function render() {
            const root = document.getElementById('app');
            if (state.view === 'admin') {
                root.innerHTML = renderAdminView();
            } else {
                root.innerHTML = renderPublicView();
            }
            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
